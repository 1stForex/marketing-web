version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - NEXT_PUBLIC_ENABLED_LOCALES=en,fr-CA,es-419,pt-BR,de,id,tr,vi,hi,ar npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
